include:
  - path: ./docker/compose.mongonaut.yml
  - path: ./docker/compose.traefik.yml

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./docker/mongo-rs-init.sh:/mongo-rs-init.sh:ro
    entrypoint: ["/bin/bash", "/mongo-rs-init.sh"]
    restart: "no"

  # Catch-all SMTP for local mail (UI http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  seed:
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DOCKER: "1"
      SECRETS_TEMPLATE: dev
      MONGO_URI: mongodb://mongo:27017/adventureland?replicaSet=rs0
      MONGO_DB: adventureland
      RDBMS_URL: https://raw.githubusercontent.com/kaansoral/adventureland-appserver/main/storage/db.rdbms
    volumes:
      - secrets_dev:/app/secretsandconfig
      - node_modules_root:/app/node_modules
      - node_modules_game:/app/node/node_modules
      - precomputed:/shared/precomputed
    command: ["seed"]
    restart: "no"

  backend:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      traefik:
        condition: service_started
    environment:
      DOCKER: "1"
      SECRETS_TEMPLATE: dev
      PORT: "8090"
      # Restart node on host file edits (Windows Docker needs polling)
      DEV_WATCH: "1"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    # Host ports kept as fallback; happy path is https://play.al.local via Traefik
    ports:
      - "8090:8090"
    volumes:
      - .:/app
      - secrets_dev:/app/secretsandconfig
      - node_modules_root:/app/node_modules
      - node_modules_game:/app/node/node_modules
    command: ["backend"]
    stop_grace_period: 30s
    networks:
      - default
      - al_edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.play.rule=Host(`play.al.local`)"
      - "traefik.http.routers.play.entrypoints=websecure"
      - "traefik.http.routers.play.tls=true"
      - "traefik.http.services.play.loadbalancer.server.port=8090"

  gameserver:
    build: .
    depends_on:
      backend:
        condition: service_started
    environment:
      DOCKER: "1"
      SECRETS_TEMPLATE: dev
      SERVER_KEY: local
      DEV_WATCH: "1"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    ports:
      - "7192:7192"
    volumes:
      - .:/app
      - secrets_dev:/app/secretsandconfig
      - node_modules_root:/app/node_modules
      - node_modules_game:/app/node/node_modules
      - precomputed:/shared/precomputed:ro
    command: ["gameserver"]
    stop_grace_period: 90s
    networks:
      - default
      - al_edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gs.rule=Host(`gs.al.local`)"
      - "traefik.http.routers.gs.entrypoints=websecure"
      - "traefik.http.routers.gs.tls=true"
      - "traefik.http.services.gs.loadbalancer.server.port=7192"

volumes:
  mongo_data:
  secrets_dev:
  node_modules_root:
  node_modules_game:
  precomputed:
