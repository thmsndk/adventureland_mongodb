include:
  - path: ./docker/compose.mongonaut.yml

# Pure AL dev — no Traefik, no hosts file:
#   docker compose -f docker-compose.dev.yml up
# Optional HTTPS (shared Traefik + mkcert + hosts):
#   docker compose -f docker-compose.dev.yml -f docker-compose.dev.traefik.yml up --force-recreate
name: al-dev

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./docker/mongo-rs-init.sh:/mongo-rs-init.sh:ro
    entrypoint: ["/bin/bash", "/mongo-rs-init.sh"]
    restart: "no"

  # Catch-all SMTP for local mail (UI http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  seed:
    build: .
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DOCKER: "1"
      SECRETS_TEMPLATE: dev
      BASE_URL: "${BASE_URL:-}"
      GS_PUBLIC: "${GS_PUBLIC:-}"
      HTTPS_MODE: "${HTTPS_MODE:-}"
      BEHIND_PROXY: "${BEHIND_PROXY:-}"
      MONGO_URI: mongodb://mongo:27017/adventureland?replicaSet=rs0
      MONGO_DB: adventureland
      RDBMS_URL: https://raw.githubusercontent.com/kaansoral/adventureland-appserver/main/storage/db.rdbms
    volumes:
      - secrets_dev:/app/secretsandconfig
      - node_modules_root:/app/node_modules
      - node_modules_game:/app/node/node_modules
      - precomputed:/shared/precomputed
    command: ["seed"]
    restart: "no"

  backend:
    build: .
    depends_on:
      seed:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      DOCKER: "1"
      SECRETS_TEMPLATE: dev
      PORT: "8090"
      BASE_URL: "${BASE_URL:-}"
      GS_PUBLIC: "${GS_PUBLIC:-}"
      HTTPS_MODE: "${HTTPS_MODE:-}"
      BEHIND_PROXY: "${BEHIND_PROXY:-}"
      # Restart node on host file edits (Windows Docker needs polling)
      DEV_WATCH: "1"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    # http://localhost:8090 — templates default GS localhost:7192 when env unset
    ports:
      - "8090:8090"
    volumes:
      - .:/app
      - secrets_dev:/app/secretsandconfig
      - node_modules_root:/app/node_modules
      - node_modules_game:/app/node/node_modules
    # Bind-mounted entrypoint: stale images still ship `/entrypoint.sh` (plain node).
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["backend"]
    stop_grace_period: 30s

  gameserver:
    build: .
    depends_on:
      backend:
        condition: service_started
    environment:
      DOCKER: "1"
      SECRETS_TEMPLATE: dev
      SERVER_KEY: local
      BASE_URL: "${BASE_URL:-}"
      GS_PUBLIC: "${GS_PUBLIC:-}"
      HTTPS_MODE: "${HTTPS_MODE:-}"
      BEHIND_PROXY: "${BEHIND_PROXY:-}"
      DEV_WATCH: "1"
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    ports:
      - "7192:7192"
    volumes:
      - .:/app
      - secrets_dev:/app/secretsandconfig
      - node_modules_root:/app/node_modules
      - node_modules_game:/app/node/node_modules
      - precomputed:/shared/precomputed:ro
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["gameserver"]
    stop_grace_period: 90s

volumes:
  mongo_data:
  secrets_dev:
  node_modules_root:
  node_modules_game:
  precomputed:
