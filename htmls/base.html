<!DOCTYPE html>
<html>
	<head>
		<title>{{domain.title}}</title>
		<link rel="apple-touch-icon-precomposed" href="{{favicon or '/images/favicon.png'}}" /> <!-- 152 -->
		<link rel="icon" href="{{favicon or '/images/favicon.png'}}" /> <!-- 32 -->
		<!--[if IE]><link rel="shortcut icon" href="{{favicon or '/images/favicon.png'}}"><![endif]--> <!-- .ico -->
		<meta name="msapplication-TileImage" content="{{favicon or '/images/favicon.png'}}"> <!-- 144 -->
		<meta name="mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-capable" content="yes">
		<script src="/js/jquery/jquery-{{domain.jquery_version}}.min.js"{%if domain.electron%} onload="if(typeof require!=='undefined') window.$=window.jQuery=module.exports;"{%endif%}></script>
		{% if extras %}
			<link href="/js/monaco/vscode-api/monaco.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
			<link href="/css/codeui.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
			<link href="/css/codeui-outline.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
			<link href="/css/codeui-problems.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
			<link href="/css/codeui-workbench.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
			<script src="/js/keyboard.js?v={{domain.v}}"></script>
		{% endif %}
		{% block libraries %}{% endblock %}
		<script src="/js/common_functions.js?v={{domain.v}}"></script>
		<script src="/js/old_common_functions.js?v={{domain.v}}"></script>
		<script src="/js/functions.js?v={{domain.v}}"></script>
		<script src="/js/html.js?v={{domain.v}}"></script>
		<script src="/js/guide.js?v={{domain.v}}"></script>
		<link href="/css/common.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
		<link href="/css/index.css?v={{domain.v}}" rel="stylesheet" type="text/css"/>
		<script src="/data.js?v={{domain.v}}"></script>
		{# monaco-vscode-api is ~11MB; keep it after data.js so game data is not blocked #}
		{% if extras %}
			<script src="/js/monaco/vscode-api/monaco-vscode.min.js?v={{domain.v}}"></script>
			<script src="/js/monaco/types/bundle.js?v={{domain.v}}"></script>
			<script src="/js/code/monaco/language.js?v={{domain.v}}"></script>
			<script src="/js/code/monaco/diagnostics.js?v={{domain.v}}"></script>
			<script src="/js/code/monaco/prefs.js?v={{domain.v}}"></script>
			<script src="/js/code/monaco/create.js?v={{domain.v}}"></script>
			<script src="/js/code/session/state.js?v={{domain.v}}"></script>
			<script src="/js/code/session/workspace.js?v={{domain.v}}"></script>
			<script src="/js/code/session/explorer.js?v={{domain.v}}"></script>
			<script src="/js/code/session/outline.js?v={{domain.v}}"></script>
			<script src="/js/code/session/io.js?v={{domain.v}}"></script>
			<script src="/js/code/session/problems.js?v={{domain.v}}"></script>
			<script src="/js/code/session/chrome.js?v={{domain.v}}"></script>
		{% endif %}
		<style>
			html, body{
				background: black;
				color: white;
				font-family: pixel;
				font-size: 32px;
				overflow: auto;
			}
		</style>
		<!-- base.html - for simple usages [19/11/18] -->
	</head>
	<body>
		<script>
			function on_resize()
			{
				width=$(window).width();
				height=$(window).height();
				position_modals();
			}
			on_resize();
			function first_things_first()
			{
				on_resize();
				window.onresize=on_resize;
				$(document).on('click','a.eexternal',function(event) {
					if(!is_electron) return;
					event.preventDefault();
					require('electron').shell.openExternal(this.href);
				});
			}
			$(function(){
				first_things_first();
			});
		</script>
		{%block body%}{%endblock%}
	</body>
</html>
